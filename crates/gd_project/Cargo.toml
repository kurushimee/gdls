[package]
name = "gd_project"
description = "Project indexer: project.godot parsing, class_name registry, dependency graph, and the freshness watcher."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# WP-RD10: `inject_verify_violation` is gated on `cfg(any(test, fuzzing))`; cargo-fuzz passes
# `--cfg fuzzing` to every crate in its build. Declare it so `cargo check`/clippy don't flag the
# cfg as unexpected (CI denies warnings).
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }

[dependencies]
camino = "1.2.2"
# WP-RD9: junction/8.3/symlink-resolving canonicalization for the `Index::file_id` slow path, so a
# file reached through an NTFS junction or a differently-cased path interns to one `FileId`.
dunce.workspace = true
gd_syntax.workspace = true
gd_types.workspace = true
log = "0.4.29"
rustc-hash.workspace = true
walkdir.workspace = true

[dev-dependencies]
camino = "1.2.2"
