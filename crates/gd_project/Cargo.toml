[package]
name = "gd_project"
description = "Project indexer: project.godot parsing, class_name registry, dependency graph, and the freshness watcher."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
autotests = false

[lib]
# There are no doc examples to run, so `cargo test` skips the rustdoc pass.
doctest = false

# WP-RD10: `inject_verify_violation` is gated on `cfg(any(test, fuzzing))`; cargo-fuzz passes
# `--cfg fuzzing` to every crate in its build. Declare it so `cargo check`/clippy don't flag the
# cfg as unexpected (CI denies warnings).
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }

[dependencies]
camino.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
# WP-RD9: junction/8.3/symlink-resolving canonicalization for the `Index::file_id` slow path, so a
# file reached through an NTFS junction or a differently-cased path interns to one `FileId`.
dunce.workspace = true
gd_syntax.workspace = true
gd_types.workspace = true
log = "0.4.29"
rustc-hash.workspace = true
walkdir.workspace = true

# Every tests/*.rs file is a module of this one binary (see tests/main.rs), not a binary of its own.
[[test]]
name = "integration"
path = "tests/main.rs"
