# bench/budget.toml -- measured against a large real-world GDScript project (reference only).
#
# These numbers are NOT enforced by CI. They are the operator-facing reference for what
# "normal" perf looks like on a developer machine, and they back the WP-H1 memory pressure
# ladder (which loads soft_cap_mb / hard_cap_mb at startup). Re-run the calibration walk
# (the bench driver + scripts/summarize-spans.py) after any optimization and refresh.
#
# Hardware: AMD Ryzen 5 5600 6-Core / 32 GB DDR4 / SSD-backed working tree.
# Workspace: a large real-world GDScript project -- 2338 .gd files, asset-heavy ~200 GB tree
# (a representative large-project workload used for calibration).
# Capture artefacts (gitignored):
#   target/m5-p1-calib.jsonl        -- the WP-O1 JSONL trace.
#   target/m5-p1-calib-stdin.bin    -- the LSP request stream replayed by the driver.
#   target/m5-p1-calib-files.txt    -- the 2338-entry .gd inventory.
#
# Latencies are observed p50/p99 (interpolated) from the WP-O1 structured-span dump.

[cold_index]
# Workspace::load: project.godot parse + ProjectModel build + tree walk + eager-interface Index
# build for 2338 .gd files. Wall-clock from the `cold_index` span on close.
observed_ms = 3340

[reconcile]
# Post-cold-index Workspace::reconcile pass over the same 2338-file walk -- the M4 freshness
# gate that catches any drift between the cold index and the on-disk state. One pass per cold
# start; subsequent reconciles fire only on watcher overflow (need_rescan).
observed_ms = 783

[scene_index]
# M11 (#76): SceneIndex::build -- a dedicated `.tscn`/`.scn` walk (shared exclusion set) that
# parses each scene's node/script/instance relations into the scene index, built in parallel with
# the script cold index. ESTIMATED, NOT measured on the 2338-file calibration project above: that
# tree's `.tscn` count + per-scene parse cost was not captured in the M5 calibration walk (which
# predates the scene index). The scene parser is a single linear pass per file (logical-line merge
# + attr tokenize, no cross-file work at build time -- instance resolution is lazy/on-demand), so
# it is far cheaper per file than the GDScript frontend's tokenize+parse+interface-extract; the
# scene count is also typically a fraction of the `.gd` count. The operator's calibration walk
# MUST recalibrate this against the real project's scene corpus. Basis for the placeholder: ~118
# scenes / 2129 nodes parsed in well under cold_index's 3340 ms on a comparable tree.
observed_ms = 120

[warm_analyze]
# 702 samples across the calibration walk (45 didOpen events each fanning out to ~16 cross-file
# analyses via member-initializer xrefs + dirty-deps walk). p50 is the dominant case (cache hit
# on a small file); p99 is the analyzer running a full pass on a large or import-heavy file.
p50_ms = 0.1
p99_ms = 4.2

[hover]
# textDocument/hover -- 45 samples (one per opened file). p99 = 0.5 ms covers any v1 hover
# request (position-resolution + binding lookup + prose render).
p50_ms = 0.2
p99_ms = 0.5

[definition]
# textDocument/definition -- 45 samples. The path is index-only after analyze settled.
p99_ms = 0.1

[references]
# textDocument/references -- 45 samples. p99 is dominated by an in-workspace scan for a heavily
# referenced symbol (e.g. an autoload type or a base-class method touched by many subclasses);
# the p50 reflects narrower symbols. This is the slowest handler in the v1 capability set.
p99_ms = 310.1

[implementation]
# textDocument/implementation -- 45 samples. Like definition, index-only.
p99_ms = 0.1

[prepare_call_hierarchy]
# textDocument/prepareCallHierarchy -- 45 samples. Like hover/definition, fixed-cost.
p99_ms = 0.2

[workspace_symbol]
# workspace/symbol via nucleo-matcher -- 5 queries ("get_", "_init", "Player", "set", "").
# Empty query returns up to the workspaceSymbolMaxResults cap; the matcher cost dominates.
p50_ms = 11.1
p99_ms = 17.2

[completion]
# textDocument/completion (M8 #64). MEASURED on the large calibration project (#99) — 298 samples.
#
# Capture (2026-08-28): the same 2414-`.gd` project as the rows above, walked with
# `scripts/lsp-poke.py` on a release build with `GDLS_LOG_FORMAT=json`, then summarized by
# `scripts/summarize-spans.py`. 101 files opened (spread evenly across the tree so cross-file
# fan-out is real), then three member-access completions per file at existing `receiver.member`
# sites — the analysis-priced path: `analyze_if_gd` resolves the base expression's type "exactly
# like hover", then the resolved type's full member set is enumerated and rendered.
#
# NOT the same session as the rows above: this walk ran under WSL2 on the same CPU class, over a
# script/scene-only copy of the tree (2414 `.gd` + 14017 `.tscn`, asset payloads excluded), so its
# cold_index / reconcile / RSS legs are NOT comparable to the asset-heavy capture those rows come
# from and were deliberately left alone. The two request rows below are per-request latencies on a
# warmed index, which that difference does not touch.
#
# The old estimate (p50 0.3 / p99 6.0, anchored to warm_analyze) was close on the median and
# conservative on the tail: p50 0.4, p95 1.6, p99 4.0, max 5.3.
p50_ms = 0.4
p99_ms = 4.0

[signature_help]
# textDocument/signatureHelp (M8 #65). MEASURED on the same walk (#99) — 283 samples: three
# call-argument positions per opened file, cursor just inside the `(`.
#
# Confirms the M8 reasoning that signatureHelp sits at or below completion: it resolves the call
# receiver the same way but renders ONE signature instead of the whole member set — p50 0.1,
# p95 0.8, p99 1.4, max 1.5, roughly a third of completion's tail. The old placeholder mirrored
# completion's estimate (0.3 / 6.0).
p50_ms = 0.1
p99_ms = 1.4

[memory]
# Peak resident-set observed during the calibration walk via the WP-O2 RssSampler. baseline is
# the reading at server start; peak is the maximum since baseline (sysinfo RSS).
# WP-H1 loads soft_cap_mb / hard_cap_mb at startup and uses them in the pressure ladder:
#   soft = 2 * peak  -> shed entries from the LRU caches (parse + analysis)
#   hard = 4 * peak  -> stop accepting new analyze requests, surface a memory-pressure event
baseline_rss_mb = 9.6
peak_rss_mb = 291
soft_cap_mb = 582
hard_cap_mb = 1164
