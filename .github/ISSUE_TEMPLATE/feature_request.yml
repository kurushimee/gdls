name: Feature request
description: Propose a capability or improvement.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing, please check what's already decided. The full LSP surface, including the
        capabilities gdls deliberately does not serve and why, is in
        [`docs/09-lsp-conventions.md`](https://github.com/kurushimee/gdls/blob/main/docs/09-lsp-conventions.md) §5.
        Out-of-scope areas (running GDScript, a GUI or debugger, a built-in formatter, Godot's custom
        protocol extensions) are in
        [`docs/00-overview.md`](https://github.com/kurushimee/gdls/blob/main/docs/00-overview.md) §3.
  - type: textarea
    id: problem
    attributes:
      label: Problem / use case
      description: What are you trying to do that gdls doesn't support today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: dropdown
    id: parity
    attributes:
      label: Does Godot's own GDScript LSP do this?
      description: gdls's first bar is parity with Godot, so "Godot already does it" is a strong signal.
      options:
        - "Yes — Godot's LSP already does this"
        - "No — this would exceed Godot"
        - "Not sure"
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything else (optional)
