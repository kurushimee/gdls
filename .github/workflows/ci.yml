name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly deeper fuzz run (Mondays 06:00 UTC).
    - cron: "0 6 * * 1"

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: build · test · clippy · fmt
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain (pinned by rust-toolchain.toml)
        run: rustup show
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build
        run: cargo build --workspace --all-targets
      # Includes the conformance ratchet and the Layer-1 panic-smoke test (always-on, stable).
      - name: Test
        run: cargo test --workspace
      # Release profile disables debug-assertions, so several gd_project index mutation-recovery
      # tests (the catch_unwind / keep-serving-after-panic paths that only matter in the shipped
      # release build) early-return under `cfg!(debug_assertions)` in the debug `Test` step above.
      # Run them here so the recovery contract is actually exercised by CI, not silently skipped.
      # Scoped to gd_project (the only crate with release-only test bodies today); widen if others add them.
      - name: Test (release · index recovery paths)
        run: cargo test -p gd_project --release
      # M5 WP-O1 tracing-overhead micro-bench step. Re-runs the same `cold_index_scales_to_500_files`
      # test the prior `Test` step already exercised, but with `GDLS_LOG=trace` set so the tracing
      # subscriber's EnvFilter is forced to its most-verbose setting. The existing test asserts a
      # generous 20-second wall-time ceiling internally; a tracing overhead regression that pushes
      # this past 20s trips the same assertion. Sibling `lifecycle.rs` exercises the full server
      # lifecycle under the same GDLS_LOG=trace and verifies tracing-subscriber init + the
      # `tracing-log` bridge do not panic or deadlock under load. If the 5%-delta budget the plan
      # called for is exceeded in practice (caught locally via `gdls bench --record/--replay`),
      # switch to `tracing-subscriber::fmt::Subscriber::with_max_level(LevelFilter::INFO)` to drop
      # the trace-level formatting cost on the hot path.
      - name: Tracing-overhead smoke (GDLS_LOG=trace)
        env:
          GDLS_LOG: trace
        run: |
          cargo test -p gd_project --test perf_scale cold_index_scales_to_500_files
          cargo test -p gd_server --test lifecycle

  # Layer 2: coverage-guided libFuzzer. Nightly + Linux only (cargo-fuzz is unsupported on Windows),
  # and the `fuzz/` crate lives outside the workspace so the `check` job above never compiles it.
  # Runs on pushes to main and on the weekly schedule; PRs rely on the Layer-1 smoke test for speed.
  fuzz:
    name: fuzz · parse + analyze + index (nightly libFuzzer)
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    env:
      RUSTFLAGS: "" # don't deny warnings in the sanitizer/libFuzzer build
    steps:
      - uses: actions/checkout@v4
      - name: Install nightly
        run: |
          rustup toolchain install nightly --profile minimal
          rustup default nightly
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Seed corpus from the conformance .gd files
        run: |
          mkdir -p fuzz/corpus/parse fuzz/corpus/analyze
          find crates/gd_syntax/tests/conformance/corpus -name '*.gd' -exec cp {} fuzz/corpus/parse/ \;
          find crates/gd_analyze/tests/conformance/corpus -name '*.gd' -exec cp {} fuzz/corpus/analyze/ \;
      - name: Fuzz parse (bounded)
        run: cargo +nightly fuzz run parse -- -max_total_time=60 -timeout=10
      # Layer 2 of the three-layer gate (docs/06): the analyzer must never panic on any input the
      # parser accepts. This step was missing — the analyze target silently rotted (it didn't even
      # compile against the current `analyze` signature) until the v1.0.4 work tripped over it.
      - name: Fuzz analyze (bounded)
        run: cargo +nightly fuzz run analyze -- -max_total_time=60 -timeout=10
      # The index-invariant target's op set is change / remove: it drives `Index`'s incremental
      # mutators and asserts `verify()` holds after every mutation. `txn`'s quarantine RECOVERY path
      # is intentionally NOT fuzzed — under cargo-fuzz's debug-assertions-on build `txn` answers any
      # post-state violation with its debug-`panic!`, and libfuzzer's panic hook aborts before the
      # quarantine branch runs (so a real desync surfaces as a crash; recovery is unreachable here).
      # Quarantine recovery is covered by gd_project's release unit tests instead (the
      # `Test (release · index recovery paths)` step above).
      - name: "Fuzz index_invariants (mutator invariants)"
        run: cargo +nightly fuzz run index_invariants -- -max_total_time=60 -timeout=10
