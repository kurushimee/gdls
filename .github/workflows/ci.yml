name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "editors/**", "scripts/**", "LICENSE"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "editors/**", "scripts/**", "LICENSE"]
  schedule:
    # Nightly deep fuzz run (06:00 UTC).
    - cron: "0 6 * * *"
  workflow_dispatch:

# A new push to a pull request cancels that PR's run still in progress. Runs on main each get their
# own group, so every merge is checked.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: check (${{ matrix.os }})
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain (pinned by rust-toolchain.toml)
        run: rustup show
      # Only main saves the cache, so pull requests restore main's dependency builds without
      # crowding each other out of the repository's cache quota.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Formatting and lints read the same source on every OS, so only the Linux leg runs them.
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: Clippy
        if: runner.os == 'Linux'
        run: cargo lint
      # The fuzz crate is its own workspace, so nothing above compiles it, and a signature change in
      # a library crate used to break it unseen until the fuzz job ran on main. A stable check
      # catches that here; the nightly libFuzzer build only matters for actually fuzzing.
      - name: Fuzz crate compiles
        if: runner.os == 'Linux'
        run: cargo check --manifest-path fuzz/Cargo.toml --bins
      # Includes the conformance ratchets and the Layer-1 panic-smoke test (always-on, stable).
      - name: Test
        run: cargo test --workspace

  # Layer 2: coverage-guided libFuzzer. Nightly + Linux only (cargo-fuzz is unsupported on Windows).
  # Every push to main fuzzes each target for a minute, all five at once; the nightly schedule runs
  # them for ten. Pull requests rely on the Layer-1 smoke test and the stable compile check above.
  fuzz:
    name: fuzz (nightly libFuzzer)
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    env:
      RUSTFLAGS: "" # don't deny warnings in the sanitizer/libFuzzer build
      FUZZ_SECONDS: ${{ github.event_name == 'schedule' && 600 || 60 }}
    steps:
      - uses: actions/checkout@v4
      - name: Install nightly
        run: rustup toolchain install nightly --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Seed corpus from the conformance .gd files
        run: |
          mkdir -p fuzz/corpus/parse fuzz/corpus/analyze fuzz/corpus/complete_context fuzz/corpus/scene_parse
          find crates/gd_syntax/tests/conformance/corpus -name '*.gd' -exec cp {} fuzz/corpus/parse/ \;
          find crates/gd_analyze/tests/conformance/corpus -name '*.gd' -exec cp {} fuzz/corpus/analyze/ \;
          # The completion-context classifier takes the same `.gd` source shape, so it starts from
          # the parser corpus too.
          find crates/gd_syntax/tests/conformance/corpus -name '*.gd' -exec cp {} fuzz/corpus/complete_context/ \;
          # M11 (#76): the scene parser takes `.tscn` text — seed from the gd_project scene fixtures.
          find crates/gd_project/tests/fixtures/scenes -name '*.tscn' -exec cp {} fuzz/corpus/scene_parse/ \;
      - name: Build the fuzz targets
        run: cargo +nightly fuzz build
      # What each target guards (docs/06):
      # - parse, analyze: the parser and the analyzer never panic on any input.
      # - index_invariants: `Index`'s change/remove mutators keep `verify()` holding after every
      #   mutation. `txn`'s quarantine recovery is not fuzzed: cargo-fuzz keeps debug-assertions on,
      #   so a violation hits the debug panic first. gd_project's unit tests cover recovery instead.
      # - complete_context: the cursor classifier never panics at any byte offset of any input.
      # - scene_parse: the `.tscn` parser never panics, overflows, or hangs, including on a
      #   self-instancing cycle.
      - name: Fuzz all targets at once
        run: |
          targets=(parse analyze index_invariants complete_context scene_parse)
          pids=()
          for t in "${targets[@]}"; do
            cargo +nightly fuzz run "$t" -- -max_total_time="$FUZZ_SECONDS" -timeout=10 > "$RUNNER_TEMP/fuzz-$t.log" 2>&1 &
            pids+=($!)
          done
          failed=0
          for i in "${!targets[@]}"; do
            if wait "${pids[$i]}"; then
              echo "${targets[$i]}: $(grep -E '^Done [0-9]+ runs' "$RUNNER_TEMP/fuzz-${targets[$i]}.log" | tail -1)"
            else
              echo "::error::fuzz target ${targets[$i]} failed"
              tail -n 80 "$RUNNER_TEMP/fuzz-${targets[$i]}.log"
              failed=1
            fi
          done
          exit "$failed"
      - name: Upload crash inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
